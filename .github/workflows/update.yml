name: Update Gold Market Data

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:

    runs-on: ubuntu-latest

    steps:

      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect latest gold data
        run: python collector.py

      - name: Save updated JSON
        run: |

          git config user.name "gold-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market.json

          if git diff --cached --quiet; then
            echo "No new market data."
            exit 0
          fi

          git commit -m "Update gold market data"

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
